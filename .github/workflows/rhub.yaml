name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    container: ${{ matrix.config.container }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: macos-15,       r: 'release'}  # ARM64
          - {os: windows-latest, r: 'release'}
          - {os: windows-11-arm, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: ubuntu-latest,  r: 'clang23',  container: 'ghcr.io/r-hub/containers/clang23:latest'}
          - {os: ubuntu-latest,  r: 'gcc13',    container: 'ghcr.io/r-hub/containers/gcc13:latest'}
          - {os: ubuntu-latest,  r: 'valgrind', container: 'ghcr.io/r-hub/containers/valgrind:latest'}
          - {os: ubuntu-latest,  r: 'rchk',     container: 'ghcr.io/r-hub/containers/rchk:latest'}

    steps:
      - uses: actions/checkout@v4

      # 'R CMD check --as-cran' needs checkbashisms (from devscripts) to check configure/cleanup
      - name: Install checkbashisms
        if: matrix.config.r == 'rchk'
        run: |
          if command -v checkbashisms >/dev/null 2>&1; then exit 0; fi
          SUDO=""; if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
          $SUDO apt-get update -qq
          $SUDO apt-get install -y --no-install-recommends devscripts
        shell: bash

      - uses: r-lib/actions/setup-r@v2
        if: ${{ !matrix.config.container }}
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # rchk only checks C-level PROTECT usage, so Suggests are not needed there.
      # Installing them pulls the Bioconductor chain (IRanges, S4Arrays), whose
      # OpenMP build links libomp.so.5, which the rchk image does not provide.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: ${{ matrix.config.r == 'rchk' && '"hard"' || '"all"' }}
          extra-packages: ${{ matrix.config.r == 'rchk' && 'any::rcmdcheck, any::testthat' || 'any::rcmdcheck' }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.r == 'rchk' && 'false' || 'true' }}
        with:
          upload-snapshots: true
          build_args: ${{ matrix.config.r == 'rchk' && 'c("--no-manual", "--no-build-vignettes")' || '"--no-manual"' }}
          args: ${{ matrix.config.r == 'rchk' && 'c("--no-manual", "--as-cran", "--ignore-vignettes")' || 'c("--no-manual", "--as-cran")' }}
